<!doctype html>
<html lang="{{ .Site.Language.Locale | default .Site.Language.Lang }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f0e8">
  <meta name="description" content="{{ with .Description }}{{ . }}{{ else }}{{ .Site.Params.description }}{{ end }}">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="{{ if eq .Site.Language.Lang "en" }}en_US{{ else }}zh_TW{{ end }}">
  <meta property="og:title" content="{{ if .IsHome }}{{ i18n "meta_home_title" }}{{ else }}{{ .Title }} | {{ .Site.Title }}{{ end }}">
  <meta property="og:description" content="{{ with .Description }}{{ . }}{{ else }}{{ .Site.Params.description }}{{ end }}">
  <meta property="og:image" content="{{ "images/community-illustration.webp" | absURL }}">
  <meta property="og:url" content="{{ .Permalink }}">
  <meta name="twitter:card" content="summary_large_image">
  <title>{{ if .IsHome }}{{ i18n "meta_home_title" }}{{ else }}{{ .Title }} | {{ .Site.Title }}{{ end }}</title>
  <link rel="preload" href="{{ "fonts/lxgw-wenkai-tc-regular.woff2" | relURL }}" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="{{ "fonts/lxgw-wenkai-tc-medium.woff2" | relURL }}" as="font" type="font/woff2" crossorigin>
  {{ $style := resources.Get "css/main.css" | minify | fingerprint }}
  <link rel="stylesheet" href="{{ $style.RelPermalink }}" integrity="{{ $style.Data.Integrity }}">
  <link rel="icon" href="{{ "images/avatar.png" | relURL }}">
  {{ range .AllTranslations }}<link rel="alternate" hreflang="{{ .Language.Locale }}" href="{{ .Permalink }}">{{ end }}
</head>
<body class="{{ if .IsHome }}home{{ else }}inner-page{{ end }}">
  <a class="skip-link" href="#main">{{ i18n "skip_content" }}</a>
  {{ partial "header.html" . }}
  <main id="main">{{ block "main" . }}{{ end }}</main>
  {{ partial "footer.html" . }}
  {{ $script := resources.Get "js/site.js" | minify | fingerprint }}
  <script src="{{ $script.RelPermalink }}" integrity="{{ $script.Data.Integrity }}" defer></script>
</body>
</html>
